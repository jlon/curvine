syntax = "proto2";
package proto;

option java_package = "io.curvine.proto";
option java_multiple_files = true;
option java_outer_classname = "QuotaProto";

import "common.proto";

// Quota state enum
enum QuotaStatePb {
  AVAILABLE = 0;
  CALCULATING = 1;
  EXCEEDED = 2;
}

// Quota information
message QuotaInfoPb {
  required string path = 1;           // Directory path
  required int64 quota_size = 2;      // Maximum allowed size in bytes
  required int64 used_size = 3;       // Current used size in bytes
  required QuotaStatePb state = 4;    // Current quota state
  required int64 created_time = 5;    // Creation timestamp (milliseconds)
  required int64 updated_time = 6;    // Last update timestamp (milliseconds)
}

// Add quota request
message AddQuotaRequest {
  required string path = 1;
  required int64 quota_size = 2;
}

// Add quota response
message AddQuotaResponse {
  // No fields needed - operation success is indicated by RPC success
}

// Update quota request
message UpdateQuotaRequest {
  required string path = 1;
  required int64 quota_size = 2;
}

// Update quota response
message UpdateQuotaResponse {
}

// Remove quota request
message RemoveQuotaRequest {
  required string path = 1;
}

// Remove quota response
message RemoveQuotaResponse {
}

// Get quota info request
message GetQuotaInfoRequest {
  required string path = 1;
}

// Get quota info response
message GetQuotaInfoResponse {
  optional QuotaInfoPb quota_info = 1;
}

// Get quota table request
message GetQuotaTableRequest {
}

// Get quota table response
message GetQuotaTableResponse {
  repeated QuotaInfoPb quota_table = 1;
}
